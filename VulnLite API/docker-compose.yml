version: "3.9"

services:
  web:
    build: .
    develop:
      watch:
        - path: ./app
          action: sync
          target: /app/app
        - path: ./requirements.txt
          action: rebuild
        - path: ./Dockerfile
          action: rebuild
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: vuln
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
